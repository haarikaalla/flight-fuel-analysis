[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-fuel-analysis"
version = "0.2.0"
description = "Explainable, coverage-aware selective regression for retrospective flight-fuel estimates"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.1,<3",
  "pyarrow>=15,<30",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
  "matplotlib>=3.7,<4",
]

[project.scripts]
flight-fuel-advanced = "flight_fuel.advanced:main"
flight-fuel-stream = "flight_fuel.streaming:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
